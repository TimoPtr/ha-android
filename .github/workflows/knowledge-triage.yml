name: Knowledge triage

on: # yamllint disable-line rule:truthy
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue-number:
        description: Issue to triage
        required: true
        type: string

permissions: {}

jobs:
  triage:
    # An issue created with a label fires opened and labeled at once; only ai-recheck labels start a run.
    # Skipped here, before the reusable workflow, so the duplicate run never queues behind the real one.
    if: github.event_name != 'issues' || github.event.action != 'labeled' || github.event.label.name == 'ai-recheck'
    # One run per issue at a time: an ai-recheck applied during a run waits instead of racing it.
    concurrency:
      group: knowledge-triage-${{ github.event.issue.number || inputs.issue-number }}
      cancel-in-progress: false
    uses: TimoPtr/auto-triage/.github/workflows/triage.lock.yml@4b2f8ab527a788e42810750a647ec19e678950c7 # v0.2.1
    # contents and actions for the checkout and the index artifact fallback, issues for the label removal
    # and the comment, pull-requests read for gh-aw's own conclusion jobs, copilot-requests for the agent.
    # Issues from anyone are triaged; a labeled event runs only for ai-recheck.
    permissions:
      contents: read  # checkouts of this repository and of the bot scripts
      actions: read  # restores the index artifact and passes the handoff between jobs
      issues: write  # removes the ai-recheck label, minimizes older bot comments, posts the comment
      pull-requests: read  # required by the gh-aw activation job
      copilot-requests: write  # the agent job runs on Copilot with the workflow token
    with:
      issue-number: ${{ github.event.issue.number || inputs.issue-number }}
      event-action: ${{ github.event.action || 'dispatch' }}
      label: ${{ github.event.label.name || '' }}

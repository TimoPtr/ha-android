name: Knowledge index append

on: # yamllint disable-line rule:truthy
  issues:
    types: [closed]
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  append:
    # pull_request_target keeps the base repository's cache scope for forks; the called workflow never
    # checks out pull request code, it only reads the API.
    uses: TimoPtr/auto-triage/.github/workflows/append-on-close.yml@4b2f8ab527a788e42810750a647ec19e678950c7 # v0.2.1
    permissions:
      contents: read  # the called workflow checks this repository out
      actions: read  # restores the index artifact of the last build
    with:
      slug: android
      item: ${{ github.event_name == 'issues' && format('issue:{0}', github.event.issue.number) || format('pull:{0}', github.event.pull_request.number) }}

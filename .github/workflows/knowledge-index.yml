name: Knowledge index

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Force a full rebuild instead of an incremental build
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/knowledge-bot.yaml
      - .github/workflows/knowledge-index.yml

permissions: {}

jobs:
  build:
    uses: TimoPtr/auto-triage/.github/workflows/build-index.yml@4b2f8ab527a788e42810750a647ec19e678950c7 # v0.2.1
    permissions:
      contents: read  # the called workflow checks this repository out for the docs and code sources
      actions: read  # restores the previous index and feedback artifacts
      issues: write  # keeps the feedback digest issue and the eval regression issue
    with:
      slug: android
      checkouts: |
        home-assistant/companion.home-assistant
        home-assistant/contributors.home-assistant.io
      full: ${{ github.event_name == 'workflow_dispatch' && inputs.full || false }}
